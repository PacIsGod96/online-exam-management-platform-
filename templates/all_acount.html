{%extends "base.html"%}

{% block title %}All Accounts{% endblock %}
{%block body%}


    <h1>All Accounts</h1>
    <table class="table1">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Created At</th>
        </tr>
        {% for account in accounts %}
        <tr>
            <td>{{ account.account_id }}</td>
            <td>{{ account.username }}</td>
            <td>{{ account.created_at }}</td>
        </tr>
        {% endfor %}
    </table>



{%endblock%}
