{%extends "base.html"%}

{% block title %}register{% endblock %}
{%block content%}
    <style>
        .login_signup_div{
            width: 400px;
            height: 500px;
            border: 3px solid black;
            border-radius: 25px;
            overflow: hidden;
            margin: 100px auto;
            position: relative;
        }

        .panel_container{
            display: flex;
            width: 800px;
            transition: transform 0.5s ease;
        }

        .panel{
            width: 400px;
            height: 500px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel::-webkit-scrollbar{
            width: 6px;
        }

        .panel::-webkit-scrollbar-thumb{
            background-color: #888;
            border-radius: 3px;
        }

        .panel::-webkit-scrollbar-thumb:hover{
            background-color: #555;
        }

        .login_label h1{
            font-size: 50px;
            text-align: center;
            margin-bottom: 20px;
        }

        .panel label{
            display: block;
            margin-top: 10px;
            font-size: 18px;
        }

        .panel input{
            width: 100%;
            height: 35px;
            border: 1px solid black;
            border-radius: 5px;
            padding-left: 5px;
            margin-top: 5px;
        }

        .switch{
            margin-top: 20px;
            text-decoration: underline;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            color: blue;
        }

        .switch:hover{
            color: darkblue;
        }
    </style>
</head>
<body>
    <div class="login_signup_div"> 
        <div class="panel_container" id="panelContainer">
            <div class="login_div panel">
                <div class="login_label">
                    <h1 style="font-size: 60px;">Login</h1>
                </div>
                <form id="login_form" method="POST" action="/login">
                    <div class="login_info" style="margin-bottom: 35px;">
                        <label>Username</label>
                        <input type="text" placeholder="username" name="login_username">
                    </div>
                    <div class="login_info">
                        <label>Password</label>
                        <input type="text" placeholder="password" name="login_password">
                    </div>
                    <button type="submit" style="margin-top: 15px;">Login</button>
                </form>
                <p onclick="showSignup()" class="switch">Sign Up</p>
            </div>
            <div class="signup_div panel">
                <div class="login_label">
                    <h1>Sign Up</h1>
                </div>
                <form class="signup_info" id="signupForm" action="/" method="POST" onsubmit="return handlesSignUpSubmit(event)">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="username" id="username">

                    <label>Password</label>
                    <input type="text" name="password_hash" placeholder="password" id="password_hash">

                    <label>First Name</label>
                    <input type="text" name="first_name" placeholder="first name" id="first_name">

                    <label>Last Name</label>
                    <input type="text" name="last_name" placeholder="last name" id="last_name">

                    <label>Role</label>
                    <select name="role" id="role" onchange="toggleIdInput()">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>

                    <div id="id_input_container">
                        <label id="id_label">Student ID</label>
                        <input type="text" id="role_id" name="role_id" placeholder="Enter your ID">
                    </div>

                    <button type="submit" style="margin-top: 15px;">Register</button>
                </form>
                <p onclick="showLogin()" class="switch">Back to Login</p>
            </div>
        </div>  
    </div>

    <script>
        const loginForm = document.getElementById('login_form');

        loginForm.addEventListener('submit', () => {
            setTimeout(() => {
                loginForm.reset();
            }, 50);
        });

        function handlesSignUpSubmit(event) {
            setTimeout(() => {
                const inputs = document.querySelectorAll("#signupForm input");
                inputs.forEach(input => input.value = "");

                document.getElementById("role").value = "student";
                toggleIdInput()

                showLogin();
            }, 100);

            return true;
        }

        function showSignup() {
            const container = document.getElementById("panelContainer");
            const signupPanel = document.querySelector(".signup_div")

            container.style.transform = "translateX(-400px)";
            signupPanel.scrollTop = 0;
        }

        function showLogin() {
            const container = document.getElementById("panelContainer");
            const loginPanel = document.querySelector(".login_div")

            container.style.transform = "translateX(0)";
            loginPanel.scrollTop = 0;
        }

        function toggleIdInput() {
            const role = document.getElementById("role").value;
            const label = document.getElementById("id_label");
            const input = document.getElementById("role_id");

            if (role === "student") {
                label.textContent = "Student ID";
                input.placeholder = "enter student id";
            } else {
                label.textContent = "Teacher ID";
                input.placeholder = "enter teacher id"
            }
        }   
    </script>
{%endblock%}
